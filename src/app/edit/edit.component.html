<form (ngSubmit)="editUser()" #userForm="ngForm" class="max-w-lg mx-auto p-6 bg-white rounded-lg shadow-md">
  
    <!-- Success Toast -->
    <div *ngIf="showToast" class="mt-4 flex items-center p-4 text-green-800 bg-green-100 border border-green-400 rounded-md shadow-md">
      <p class="txt-sm text-green-600">User Edited Successfully!</p>
    </div>
  
    <!-- First Name -->
    <div class="mb-4">
      <label for="fname" class="block text-sm font-medium text-gray-700">First Name:</label>
      <input id="fname" [(ngModel)]="newUser.fname" name="fname" required #fname="ngModel"
             class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      <div *ngIf="fname.invalid && fname.touched" class="text-red-500 text-sm">First Name is required.</div>
    </div>
  
    <!-- Last Name -->
    <div class="mb-4">
      <label for="lname" class="block text-sm font-medium text-gray-700">Last Name:</label>
      <input id="lname" [(ngModel)]="newUser.lname" name="lname" required #lname="ngModel"
             class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      <div *ngIf="lname.invalid && lname.touched" class="text-red-500 text-sm">Last Name is required.</div>
    </div>
  
    <!-- City -->
    <div class="mb-4">
      <label for="city" class="block text-sm font-medium text-gray-700">City:</label>
      <input id="city" [(ngModel)]="newUser.city" name="city" required #city="ngModel"
             class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      <div *ngIf="city.invalid && city.touched" class="text-red-500 text-sm">City is required.</div>
    </div>
  
    <!-- State -->
    <div class="mb-4">
      <label for="state" class="block text-sm font-medium text-gray-700">State:</label>
      <input id="state" [(ngModel)]="newUser.state" name="state" required #state="ngModel"
             class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      <div *ngIf="state.invalid && state.touched" class="text-red-500 text-sm">State is required.</div>
    </div>
  
    <!-- Zipcode -->
    <div class="mb-4">
      <label for="zipcode" class="block text-sm font-medium text-gray-700">Zipcode:</label>
      <input id="zipcode" [(ngModel)]="newUser.zipcode" name="zipcode" required #zipcode="ngModel"
             class="mt-1 p-2 w-full border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      <div *ngIf="zipcode.invalid && zipcode.touched" class="text-red-500 text-sm">Zipcode is required.</div>
    </div>
  
    <button type="submit" [disabled]="userForm.invalid"
            class="w-full mt-4 py-2 px-4 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600">
      Edit User
    </button>
  
  </form>
